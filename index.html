<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>風情報アップローダー</title>
<style>
:root{--bg:#f4f6f8;--fg:#14202b;--card:#fff;--ac:#0a7ea4;--bd:#cfd8dc;--mut:#5b6b77}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--fg:#e8eef2;--card:#1a232b;--ac:#4cc3e8;--bd:#33424d;--mut:#9fb0bb}}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Noto Sans CJK JP",sans-serif;max-width:560px;margin-inline:auto}
h1{font-size:1.2rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:.95rem;margin:0 0 8px;color:var(--mut)}
label.chip{display:inline-block;margin:0 6px 6px 0}
label.chip input{display:none}
label.chip span{display:inline-block;padding:8px 14px;border:1px solid var(--bd);border-radius:20px}
label.chip input:checked+span{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=text],input[type=date],textarea{width:100%;padding:10px;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
button,.btn{display:block;width:100%;padding:14px;margin-top:8px;font:inherit;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:#fff;text-align:center;text-decoration:none}
button.sub{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button:disabled{opacity:.5}
canvas,video{width:100%;border-radius:8px;background:#000;display:block}
.hide{display:none}
.mut{color:var(--mut);font-size:.85rem}
</style>
</head>
<body>
<h1>🌬 風情報アップローダー</h1>

<div class="card">
  <h2>① 動画を選ぶ</h2>
  <input type="file" id="file" accept="video/*" class="hide">
  <button id="pick">📂 動画の一覧から選ぶ</button>
  <div id="fname" class="mut"></div>
</div>

<div class="card">
  <h2>② 場所・日付・コメント</h2>
  <div id="spots">
    <label class="chip"><input type="radio" name="spot" value="津久井浜" checked><span>津久井浜</span></label>
    <label class="chip"><input type="radio" name="spot" value="ベトナムムイネー"><span>ベトナムムイネー</span></label>
    <label class="chip"><input type="radio" name="spot" value="本栖"><span>本栖</span></label>
    <label class="chip"><input type="radio" name="spot" value="その他"><span>その他</span></label>
  </div>
  <input type="text" id="other" class="hide" placeholder="場所を入力">
  <p class="mut" style="margin:8px 0 4px">日付（動画の撮影日が自動で入ります）</p>
  <input type="date" id="date">
  <p class="mut" style="margin:8px 0 4px">コメント</p>
  <input type="text" id="comment" placeholder="例: 午前は4.5ジャスト 午後は少し落ちた">
  <button id="ok" disabled>OK（文字を焼き付ける）</button>
  <p class="mut">※処理は動画の長さと同じ時間かかります。画面を消さず、このタブを開いたままにしてください。</p>
</div>

<div class="card" id="work" hidden>
  <h2 id="state">処理中…</h2>
  <canvas id="cv"></canvas>
</div>

<div class="card" id="result" hidden>
  <h2>③ 確認してアップロード</h2>
  <video id="out" controls playsinline></video>
  <p class="mut" style="margin:10px 0 4px">タイトル</p>
  <input type="text" id="t" readonly>
  <p class="mut" style="margin:8px 0 4px">説明欄（コメント）</p>
  <textarea id="d" rows="4" readonly></textarea>
  <button id="share">▶ YouTubeアプリに送る（おすすめ）</button>
  <button id="copy" class="sub">タイトルと説明欄をコピー</button>
  <select id="priv" class="hide" style="width:100%;padding:10px;margin-top:8px;font:inherit"><option value="private">API: 非公開</option><option value="unlisted">API: 限定公開</option><option value="public">API: 公開</option></select>
  <button id="api" class="hide">⬆ このアプリから直接アップロード（API）</button>
  <a id="save" class="btn sub" style="background:transparent;color:var(--ac);border:1px solid var(--ac)">動画を端末に保存</a>
  <div id="msg" class="mut"></div>
</div>

<video id="src" playsinline class="hide"></video>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
// ★ 直接アップロード(API)を使う場合のみ、Google CloudのOAuthクライアントID(ウェブ)を貼る
const CLIENT_ID = "";

const WD = "日月火水木金土";
const FONT = '"Noto Sans CJK JP","Noto Sans JP",Meiryo,sans-serif';
const $ = id => document.getElementById(id);
let file, blob, M;

if (CLIENT_ID) { $("api").classList.remove("hide"); $("priv").classList.remove("hide"); }

$("pick").onclick = () => $("file").click();
$("file").onchange = e => {
  file = e.target.files[0];
  if (!file) return;
  $("fname").textContent = file.name;
  $("date").value = new Date(file.lastModified).toLocaleDateString("sv-SE");
  $("ok").disabled = false;
};
document.querySelectorAll("input[name=spot]").forEach(r => r.onchange = () => {
  $("other").classList.toggle("hide", r.value !== "その他" || !r.checked);
});

function getMeta() {
  let sp = document.querySelector("input[name=spot]:checked").value;
  if (sp === "その他") sp = $("other").value.trim();
  const [y, m, d] = $("date").value.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const date = `${y}/${String(m).padStart(2, "0")}/${String(d).padStart(2, "0")}(${WD[dt.getDay()]})`;
  const comment = $("comment").value.normalize("NFKC").trim();
  const title = `【${sp}】${date}`;               // タイトル：場所と日付
  const text = `${title} ${comment}`;              // 動画に焼く文字＝コメント
  return { sp, date, title, text, desc: `${text}\n\n#WingFoil #Shorts`, tags: [title, "WingFoil"] };
}

function wrap(ctx, text, maxW) {
  const lines = []; let l = "";
  for (const ch of text) {
    if (l && ctx.measureText(l + ch).width > maxW) { lines.push(l); l = ""; }
    l += ch;
  }
  if (l) lines.push(l);
  return lines;
}

$("ok").onclick = async () => {
  M = getMeta();
  if (!M.sp) return alert("場所を入力してください");
  $("ok").disabled = true; $("result").hidden = true; $("work").hidden = false;
  $("state").textContent = "処理中… 0%";
  try { await burn(); } catch (e) { alert("処理に失敗しました: " + e.message); $("ok").disabled = false; return; }
  $("ok").disabled = false; $("work").hidden = true;
  showResult();
};

async function burn() {
  const v = $("src");
  v.src = URL.createObjectURL(file);
  await new Promise((r, j) => { v.onloadedmetadata = r; v.onerror = () => j(new Error("動画を読み込めません")); });
  const k = Math.min(1, 1080 / Math.min(v.videoWidth, v.videoHeight));   // 短辺1080pxまで縮小
  const W = Math.round(v.videoWidth * k / 2) * 2, H = Math.round(v.videoHeight * k / 2) * 2;
  const c = $("cv"); c.width = W; c.height = H;
  const ctx = c.getContext("2d");

  // 既存 wind_ai.py と同じ仕様: 文字=幅の4.5% / 白 / 黒ボックス70% / 余白12 / 上から8% / 中央寄せ
  const fs = Math.round(W * 0.045), pad = 12, side = 20, lh = fs * 1.25;
  ctx.font = `${fs}px ${FONT}`;
  const lines = wrap(ctx, M.text, W - 2 * (pad + side));
  const bw = Math.max(...lines.map(s => ctx.measureText(s).width));
  const bx = (W - bw) / 2, by = H * 0.08;
  const drawFrame = () => {
    ctx.drawImage(v, 0, 0, W, H);
    ctx.fillStyle = "rgba(0,0,0,.7)";
    ctx.fillRect(bx - pad, by - pad, bw + 2 * pad, lines.length * lh + 2 * pad - (lh - fs));
    ctx.fillStyle = "#fff"; ctx.textBaseline = "top"; ctx.font = `${fs}px ${FONT}`;
    lines.forEach((s, i) => ctx.fillText(s, bx, by + i * lh));
  };

  const stream = c.captureStream(30);
  try {   // 元の音声を無音のまま録音に取り込む
    const ac = new AudioContext(), dst = ac.createMediaStreamDestination();
    ac.createMediaElementSource(v).connect(dst);
    dst.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    await ac.resume();
  } catch (e) {}
  const mime = ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"]
    .find(t => MediaRecorder.isTypeSupported(t)) || "";
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8e6 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  let wl; try { wl = await navigator.wakeLock.request("screen"); } catch (e) {}

  let run = true;
  v.onended = () => run = false;
  rec.start(1000); v.currentTime = 0; await v.play();
  await new Promise(res => {
    (function loop() {
      if (!run) return res();
      drawFrame();
      $("state").textContent = `処理中… ${Math.round(v.currentTime / v.duration * 100)}%`;
      requestAnimationFrame(loop);
    })();
  });
  drawFrame(); rec.stop(); await stopped;
  if (wl) wl.release();
  blob = new Blob(chunks, { type: rec.mimeType || "video/webm" });
}

function ext() { return blob.type.includes("mp4") ? "mp4" : "webm"; }

function showResult() {
  const url = URL.createObjectURL(blob);
  $("out").src = url; $("out").play();             // 焼き付け後の動画を再生
  $("t").value = M.title; $("d").value = M.desc;
  $("save").href = url; $("save").download = `wind_${M.date.slice(0, 10).replace(/\//g, "")}.${ext()}`;
  $("result").hidden = false; $("result").scrollIntoView();
}

$("copy").onclick = async () => {
  await navigator.clipboard.writeText(`${M.title}\n${M.desc}`);
  $("msg").textContent = "コピーしました（1行目＝タイトル、2行目以降＝説明欄）";
};

// ① YouTubeアプリへ共有（審査不要・公開も可能）
$("share").onclick = async () => {
  const f = new File([blob], `wind.${ext()}`, { type: blob.type.split(";")[0] });
  if (!navigator.canShare || !navigator.canShare({ files: [f] })) return alert("この端末では共有できません。「動画を端末に保存」からYouTubeアプリで追加してください。");
  try { await navigator.clipboard.writeText(M.title); } catch (e) {}
  $("msg").textContent = "タイトルをコピー済み。YouTubeの画面で貼り付け、説明欄は「タイトルと説明欄をコピー」を使ってください。";
  try { await navigator.share({ files: [f], title: M.title, text: M.desc }); } catch (e) {}
};

// ② APIで直接アップロード（Google未審査のプロジェクトだと「非公開固定」になります）
let token;
$("api").onclick = () => {
  if (token) return upload();
  google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: "https://www.googleapis.com/auth/youtube.upload",
    callback: r => { token = r.access_token; upload(); }
  }).requestAccessToken();
};
async function upload() {
  const type = blob.type.split(";")[0];
  const meta = { snippet: { title: M.title, description: M.desc, tags: M.tags, categoryId: "17" },
                 status: { privacyStatus: $("priv").value, selfDeclaredMadeForKids: false } };
  const init = await fetch("https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status", {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json; charset=UTF-8",
               "X-Upload-Content-Length": blob.size, "X-Upload-Content-Type": type },
    body: JSON.stringify(meta)
  });
  if (!init.ok) { token = null; return alert("開始に失敗: " + init.status + " " + await init.text()); }
  const xhr = new XMLHttpRequest();
  xhr.open("PUT", init.headers.get("Location"));
  xhr.setRequestHeader("Content-Type", type);
  xhr.upload.onprogress = e => $("msg").textContent = `アップロード中… ${Math.round(e.loaded / e.total * 100)}%`;
  xhr.onload = () => {
    if (xhr.status >= 300) return $("msg").textContent = "失敗: " + xhr.status + " " + xhr.responseText;
    const st = JSON.parse(xhr.responseText).status || {};
    $("msg").textContent = `アップロード完了。指定: ${$("priv").value} / 応答: ${st.privacyStatus}。` +
      (st.privacyStatus !== $("priv").value ? "指定と違う場合は未審査による非公開固定です。" : "") + "YouTube Studioで必ず確認してください。";
  };
  xhr.onerror = () => $("msg").textContent = "通信エラー";
  xhr.send(blob);
}
</script>
</body>
</html>
